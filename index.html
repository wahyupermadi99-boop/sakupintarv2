<!doctype html>
<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>SakuPintar Keuangan AI - Smart Wealth Studio</title>
    <!-- Web app manifest for PWA conversion -->
    <link rel="manifest" href="./manifest.json" />
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => {
              console.log('SakuPintar Service Worker registered successfully!', reg);
            })
            .catch(err => {
              console.warn('SakuPintar Service Worker registration failed:', err);
            });
        });
      }
    </script>
    <!-- Android dynamic top bar color -->
    <meta name="theme-color" content="#050110" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body style="background-color: #050110;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
